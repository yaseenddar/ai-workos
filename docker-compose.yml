services:
  postgres:
    image: postgres:17
    container_name: ai-workos-postgres
    environment:
      POSTGRES_DB: ai_workos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yaseen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_workos"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ai-workos-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-workos-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: