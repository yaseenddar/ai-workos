services:
  postgres:
    image: postgres:18
    container_name: ai-workos-postgres
    environment:
      POSTGRES_DB: ai_workos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yaseen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_workos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
